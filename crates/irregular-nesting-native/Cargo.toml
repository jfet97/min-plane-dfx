[package]
name = "irregular-nesting-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
serde = { version = "1", features = ["derive", "rc"] }
# `float_roundtrip`: without it, serde_json's default float parser is not
# correctly-rounded for extreme-magnitude decimal literals (verified: it
# parses `"5e+293"` one ULP away from the true nearest `f64`). The R14
# differential vector harness compares floats bit-exactly via `to_bits()`
# against real TS-computed oracle values serialized as plain JSON numbers, so
# a merely "close" parse is a correctness bug in the test harness itself, not
# a tolerable approximation. This only changes deserialization; the crate's
# own JSON serialization (`encode_failure` et al.) is unaffected.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
num-bigint = "0.4"
ryu-js = "1"
robust = "1.2.0"
# Pure-Rust, platform-independent libm port (musl/fdlibm lineage). Used by
# audited `Math.*` ports, including `transforms::generator`'s `atan2`/`asin`
# and `transforms::flattening`'s remaining non-`hypot` trig calls. Each module
# documents its own measured parity evidence; this is not a blanket claim that
# portable libm matches V8 for every operation.
libm = "0.2"
# Job-owned deterministic parallelism (Stage 4,
# docs/planning/rust-irregular-backend/parallelism-inventory.md +
# cache-concurrency-design.md §7). Never used via the ambient global pool --
# see `boundary::parallel`'s module doc.
rayon = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = "thin"
# Overflow checks stay ON in release: the migration prompt's checked-arithmetic
# rule requires that release-mode integer overflow never wraps silently.
overflow-checks = true
