[package]
name = "irregular-nesting-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it, serde_json's default float parser is not
# correctly-rounded for extreme-magnitude decimal literals (verified: it
# parses `"5e+293"` one ULP away from the true nearest `f64`). The R14
# differential vector harness compares floats bit-exactly via `to_bits()`
# against real TS-computed oracle values serialized as plain JSON numbers, so
# a merely "close" parse is a correctness bug in the test harness itself, not
# a tolerable approximation. This only changes deserialization; the crate's
# own JSON serialization (`encode_failure` et al.) is unaffected.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
num-bigint = "0.4"
ryu-js = "1"
robust = "1.2.0"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = "thin"
# Overflow checks stay ON in release: the migration prompt's checked-arithmetic
# rule requires that release-mode integer overflow never wraps silently.
overflow-checks = true
