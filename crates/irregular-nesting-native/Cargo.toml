[package]
name = "irregular-nesting-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
num-bigint = "0.4"
ryu-js = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto = "thin"
# Overflow checks stay ON in release: the migration prompt's checked-arithmetic
# rule requires that release-mode integer overflow never wraps silently.
overflow-checks = true
