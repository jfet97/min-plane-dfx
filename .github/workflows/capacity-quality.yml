name: Capacity quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  capacity-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm gate:capacity --output "$RUNNER_TEMP/capacity"
      - run: pnpm gate:compact-nine-baselines --output-dir "$RUNNER_TEMP/layouts" --skip-png
