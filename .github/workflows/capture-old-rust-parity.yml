name: Capture accepted old Rust parity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  capture:
    name: Capture ${{ matrix.target }} old N-API results
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      ACCEPTED_ENGINE_SHA: 5c72d8fca8e078b0a6e7d5f2515a8a0953475481
      SOURCE_PROVENANCE_SHA: e4f3608878611c002f343473fab72adc7d155f87
      RUST_VERSION: 1.95.0
      RUST_TARGET: ${{ matrix.target }}
      ARTIFACT_NAME: old-rust-parity-capture-${{ matrix.target }}
      ARCHIVE_NAME: old-rust-parity-capture-${{ matrix.target }}.tar.gz
    steps:
      - name: Check out immutable workflow support revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install workflow support dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Check out the accepted engine in a separate path
        shell: bash
        run: |
          git worktree add --detach "$GITHUB_WORKSPACE/accepted-engine" "$ACCEPTED_ENGINE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/accepted-engine" rev-parse HEAD)" = "$ACCEPTED_ENGINE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" cat-file -t "$SOURCE_PROVENANCE_SHA")" = commit

      - name: Record exact capture environment
        shell: bash
        run: |
          mkdir -p bundle/old/raw
          rustc -vV > bundle/rustc-vV.txt
          cargo -V > bundle/cargo-V.txt
          node --version > bundle/node-version.txt
          pnpm --version > bundle/pnpm-version.txt
          uname -a > bundle/host.txt
          shasum -a 256 accepted-engine/crates/irregular-nesting-native/Cargo.lock > bundle/source-cargo-lock.sha256
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > bundle/workflow-revision.txt
          git -C "$GITHUB_WORKSPACE" remote get-url origin > bundle/workflow-repository.txt
          printf '%s\n' "$GITHUB_WORKFLOW_REF" > bundle/workflow-ref.txt
          printf '%s\n' "$ACCEPTED_ENGINE_SHA" > bundle/accepted-engine-revision.txt
          printf '%s\n' "$SOURCE_PROVENANCE_SHA" > bundle/source-provenance-revision.txt
          printf '%s\n' "$RUST_TARGET" > bundle/target.txt
          printf '%s\n' "$RUST_VERSION" > bundle/toolchain.txt
          printf '%s\n' release > bundle/release-profile.txt
          printf '%s\n' '[]' > bundle/features.json

      - name: Validate frozen corpus before use
        shell: bash
        run: |
          pnpm --dir accepted-engine install --frozen-lockfile --ignore-scripts
          pnpm exec tsx --tsconfig tsconfig.node.json scripts/rust-parity/capture-old-parity.ts --validate-fresh-inputs \
            --corpus-dir accepted-engine/docs/artifacts/polygon-nesting-extraction-baseline \
            --repository-root accepted-engine \
            > bundle/fresh-capture-inputs.json
          node -e "const input = require('./bundle/fresh-capture-inputs.json'); process.stdout.write(input.historicalAddonSha256)" \
            > bundle/historical-addon-sha256.txt
          cp accepted-engine/docs/artifacts/polygon-nesting-extraction-baseline/migration-corpus.json bundle/migration-corpus.json
          cp accepted-engine/docs/artifacts/polygon-nesting-extraction-baseline/SHA256SUMS bundle/corpus-SHA256SUMS
          shasum -a 256 bundle/migration-corpus.json bundle/corpus-SHA256SUMS > bundle/corpus-input-sha256s.txt

      - name: Build the accepted old N-API adapter without features
        shell: bash
        run: |
          test "$(rustc -vV | awk '/^release: / {print $2}')" = "$RUST_VERSION"
          pnpm --dir accepted-engine exec node crates/irregular-nesting-native/scripts/build-native.mjs --release --target "$RUST_TARGET"
          cargo metadata --locked --format-version 1 --manifest-path accepted-engine/crates/irregular-nesting-native/Cargo.toml > bundle/native-cargo-metadata.json
          shasum -a 256 accepted-engine/crates/irregular-nesting-native/npm/*.node > bundle/native-addon-sha256s.txt
          awk 'NR == 1 { print $1 }' bundle/native-addon-sha256s.txt > bundle/fresh-addon-sha256.txt

      - name: Build structured capture metadata input
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync, writeFileSync } = require('node:fs')

          const readTrimmed = (path) => readFileSync(path, 'utf8').trim()
          const sha256 = (value) => createHash('sha256').update(value).digest('hex')
          const cargoMetadata = JSON.parse(readFileSync('bundle/native-cargo-metadata.json', 'utf8'))
          const entries = cargoMetadata.packages
            .map(({ name, version }) => ({ name, version }))
            .toSorted((first, second) => {
              const firstKey = `${first.name}@${first.version}`
              const secondKey = `${second.name}@${second.version}`
              return firstKey < secondKey ? -1 : firstKey > secondKey ? 1 : 0
            })
          const rowIds = JSON.parse(
            readFileSync('accepted-engine/docs/artifacts/polygon-nesting-extraction-baseline/migration-corpus.json', 'utf8')
          ).rows.map(({ id }) => id)
          const rustcVerbose = readFileSync('bundle/rustc-vV.txt', 'utf8')
          writeFileSync(
            'bundle/capture-metadata-input.json',
            `${JSON.stringify(
              {
                target: process.env.RUST_TARGET,
                historicalAddonSha256: readTrimmed('bundle/historical-addon-sha256.txt'),
                freshAddonSha256: readTrimmed('bundle/fresh-addon-sha256.txt'),
                rustc: {
                  identity: rustcVerbose.match(/^rustc .+$/m)[0],
                  verbose: rustcVerbose
                },
                cargo: { identity: readTrimmed('bundle/cargo-V.txt') },
                sourceCargoLockSha256: readTrimmed('bundle/source-cargo-lock.sha256').split(/\s+/)[0],
                nativeDependencies: {
                  entries,
                  sha256: sha256(`${JSON.stringify(entries)}\n`)
                },
                workflow: {
                  repository: process.env.GITHUB_REPOSITORY,
                  ref: process.env.GITHUB_REF,
                  sha: process.env.GITHUB_SHA,
                  runId: process.env.GITHUB_RUN_ID,
                  runAttempt: process.env.GITHUB_RUN_ATTEMPT
                },
                corpus: {
                  manifestName: 'migration-corpus.json',
                  manifestSha256: sha256(readFileSync('bundle/migration-corpus.json')),
                  sha256SumsSha256: sha256(readFileSync('bundle/corpus-SHA256SUMS')),
                  rowIds
                }
              },
              null,
              2
            )}\n`
          )
          NODE

      - name: Capture every validated desktop N-API request row
        shell: bash
        run: |
          addon="$GITHUB_WORKSPACE/accepted-engine/crates/irregular-nesting-native/npm/index.cjs"
          find accepted-engine/docs/artifacts/polygon-nesting-extraction-baseline/migration-corpus -mindepth 2 -maxdepth 2 -name request.json -print0 | sort -z |
            while IFS= read -r -d '' request; do
              row="$(basename "$(dirname "$request")")"
              node scripts/rust-parity/capture-old-parity-runner.cjs "$addon" "$request" "bundle/old/raw/$row" "$row"
            done
          test "$(find bundle/old/raw -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = 18

      - name: Assemble fail-closed deterministic bundle
        shell: bash
        run: |
          pnpm exec tsx --tsconfig tsconfig.node.json scripts/rust-parity/capture-old-parity.ts --assemble \
            --corpus-dir accepted-engine/docs/artifacts/polygon-nesting-extraction-baseline \
            --raw-dir bundle/old/raw \
            --output-dir capture \
            --metadata-input bundle/capture-metadata-input.json \
            --repository-root accepted-engine \
            --target "$RUST_TARGET" \
            --historical-addon-sha256 "$(cat bundle/historical-addon-sha256.txt)" \
            --fresh-addon-sha256 "$(cat bundle/fresh-addon-sha256.txt)"
          cp bundle/*.txt bundle/*.json capture/
          pnpm exec tsx --tsconfig tsconfig.node.json scripts/rust-parity/capture-old-parity.ts --finalize \
            --bundle-dir capture
          if command -v gtar >/dev/null 2>&1; then
            GNU_TAR=gtar
          elif tar --version 2>/dev/null | grep -q 'GNU tar'; then
            GNU_TAR=tar
          else
            echo 'GNU tar is required for deterministic parity archives' >&2
            exit 1
          fi
          "$GNU_TAR" --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 1970-01-01' \
            -C capture -czf "$ARCHIVE_NAME" .
          shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"

      - name: Upload immutable parity capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          overwrite: false

      - name: Attest exact parity capture archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}
