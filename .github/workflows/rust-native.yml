name: Rust native

# Per-PR tier for the crates/irregular-nesting-native Rust crate, per
# docs/planning/rust-irregular-backend/ci-matrix.md. Covers: Rust format,
# Rust lint (warnings as errors), Rust unit tests, native build, Node
# addon-load smoke test, the required-rows differential subset (TS vs
# Rust), and one-thread-vs-multi-thread determinism (thread-equality).
#
# `.github/workflows/capacity-quality.yml` is left untouched -- its two
# existing jobs (`capacity-quality`, `layout-matrix`) remain the
# TS-backend production-gate authority; this file only adds the Rust-side
# per-PR tier alongside it.
#
# Per-PR jobs run the required differential subset only. The strict full
# differential matrix runs below only for scheduled and manually dispatched
# executions so PR feedback remains practical and deterministic.
#
# Every job keeps the existing `pnpm install --frozen-lockfile
# --ignore-scripts` convention unweakened; jobs that need a compiled
# `.node` addon add one explicit, separate, non-lifecycle build step
# after install (ci-matrix.md §7 / build-packaging.md §3).

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-native-${{ github.ref }}
  cancel-in-progress: true

env:
  CRATE_MANIFEST: crates/irregular-nesting-native/Cargo.toml

jobs:
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: cargo fmt --manifest-path "$CRATE_MANIFEST" -- --check

  rust-clippy:
    name: Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: cargo clippy --manifest-path "$CRATE_MANIFEST" --all-targets -- -D warnings

  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: cargo test --release --manifest-path "$CRATE_MANIFEST"

  native-build-smoke:
    name: Native build + addon-load smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # `--ignore-scripts` also skips Electron's binary download. Install that
      # runtime explicitly so the Electron-as-Node smoke exercises the addon
      # instead of failing in `electron/index.js` before addon loading begins.
      - name: Install Electron runtime explicitly
        run: node node_modules/electron/install.js
      # Deliberate, explicit, non-lifecycle build step -- native
      # compilation is never triggered by `pnpm install` itself
      # (build-packaging.md §3).
      - run: node crates/irregular-nesting-native/scripts/build-native.mjs --release
      - run: pnpm test:native:package
      - name: Required real-addon integration tests
        env:
          MIN_PLANE_REQUIRE_NATIVE_ADDON: '1'
        run: pnpm exec vitest run tests/unit/nativeIrregularBackend.test.ts
      # Plain-Node addon-load smoke: exercises the same loader
      # (`npm/index.cjs`) and `nativeCapability` N-API entry point every
      # TS consumer resolves through (src/workers/irregular/native/loadNativeBackend.ts).
      - name: Addon-load smoke (plain Node)
        run: |
          node -e "
            const addon = require('./crates/irregular-nesting-native/npm/index.cjs');
            const capability = addon.nativeCapability();
            console.log('nativeCapability():', JSON.stringify(capability));
            if (capability.apiVersion !== 3) {
              throw new Error('native addon API mismatch: expected apiVersion 3, received ' + capability.apiVersion);
            }
          "
      # The fixture directly requires the staged addon and throws if it is
      # absent. The cleanup proof accepts termination only after its parent
      # observes both lifecycle counters with the JavaScript callback blocked.
      - name: Worker terminal barrier and cleanup proof (plain Node)
        run: |
          node crates/irregular-nesting-native/scripts/worker-terminal-lifecycle-probe.mjs terminal-barrier
          node crates/irregular-nesting-native/scripts/worker-terminal-lifecycle-probe.mjs cleanup-proof
      # `pnpm test` runs vitest inside Electron's bundled (ELECTRON_RUN_AS_NODE)
      # Node, a distinct ABI context from plain system Node
      # (tests-gates-inventory.md §12's dual-runtime finding) -- prove the
      # addon loads under both before any downstream job trusts it.
      - name: Addon-load smoke (Electron-as-node)
        run: |
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron -e "
            const addon = require('./crates/irregular-nesting-native/npm/index.cjs');
            const capability = addon.nativeCapability();
            console.log('nativeCapability() under Electron-as-node:', JSON.stringify(capability));
            if (capability.apiVersion !== 3) {
              throw new Error('native addon API mismatch: expected apiVersion 3, received ' + capability.apiVersion);
            }
          "
      - name: Worker terminal barrier and cleanup proof (Electron-as-node)
        run: |
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron crates/irregular-nesting-native/scripts/worker-terminal-lifecycle-probe.mjs terminal-barrier
          ELECTRON_RUN_AS_NODE=1 pnpm exec electron crates/irregular-nesting-native/scripts/worker-terminal-lifecycle-probe.mjs cleanup-proof

  differential-required:
    name: Differential tests (required rows)
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Node/V8 hypot oracle corpus
        run: pnpm exec tsx --tsconfig tsconfig.node.json scripts/rust-parity/dump-js-hypot.ts --check
      # Deliberate, explicit, non-lifecycle build step (same rationale as
      # native-build-smoke above) -- required before `pnpm test:differential`
      # can load the native backend at all.
      - run: node crates/irregular-nesting-native/scripts/build-native.mjs --release
      - run: pnpm test:differential

  differential-full:
    name: Differential tests (full strict matrix)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify Node/V8 hypot oracle corpus
        run: pnpm exec tsx --tsconfig tsconfig.node.json scripts/rust-parity/dump-js-hypot.ts --check
      - run: node crates/irregular-nesting-native/scripts/build-native.mjs --release
      - name: Run every required and exploratory differential row strictly
        run: pnpm exec tsx --tsconfig tsconfig.node.json scripts/rust-parity/differential-fixture-matrix.ts --strict-exploratory

  thread-equality:
    name: Thread-count determinism (thread-equality)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: cargo test --release --manifest-path "$CRATE_MANIFEST" --test thread_equality

  packaged-native-load:
    name: Packaged native load (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cargo_target: x86_64-unknown-linux-gnu
            electron_target: linux
            electron_executable: release/linux-unpacked/min-plane-dfx
            app_asar: release/linux-unpacked/resources/app.asar
          - name: Windows x64
            runner: windows-latest
            cargo_target: x86_64-pc-windows-msvc
            electron_target: win
            electron_executable: release/win-unpacked/min-plane-dfx.exe
            app_asar: release/win-unpacked/resources/app.asar
          - name: macOS arm64
            runner: macos-15
            cargo_target: aarch64-apple-darwin
            electron_target: mac
            electron_executable: release/mac-arm64/min-plane-dfx.app/Contents/MacOS/min-plane-dfx
            app_asar: release/mac-arm64/min-plane-dfx.app/Contents/Resources/app.asar
          - name: macOS x64
            runner: macos-15-intel
            cargo_target: x86_64-apple-darwin
            electron_target: mac
            electron_executable: release/mac/min-plane-dfx.app/Contents/MacOS/min-plane-dfx
            app_asar: release/mac/min-plane-dfx.app/Contents/Resources/app.asar
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/irregular-nesting-native -> target
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Electron runtime explicitly
        run: node node_modules/electron/install.js
      - run: pnpm native:electron
      - name: Build the matrix target addon
        run: node crates/irregular-nesting-native/scripts/build-native.mjs --release --target ${{ matrix.cargo_target }}
      - run: pnpm build
      - name: Package the host application with the staged native package
        run: pnpm package:native:electron --publish=never --dir --${{ matrix.electron_target }}
      - name: Verify packaged native load
        run: node scripts/verify-packaged-native-load.mjs --electron "${{ matrix.electron_executable }}" --app-asar "${{ matrix.app_asar }}"
